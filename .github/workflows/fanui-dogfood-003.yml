name: FanUI Dogfood 003 Build

on:
  push:
    branches: [main]
    paths:
      - "dogfood/003/**"
      - "skill/**"
      - "docs/foundations/responsive.md"
      - "docs/website/mobile.md"
      - "docs/web-app/mobile-workspace.md"
      - "docs/anti-patterns/v033.md"
      - "eval/**"
      - ".github/workflows/fanui-dogfood-003.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dogfood/003
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dogfood/003/package.json
      - name: Install dependencies
        run: npm install
      - name: Verify responsive closure
        run: npm run verify:responsive
      - name: Build
        run: npm run build
